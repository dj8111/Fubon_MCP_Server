[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fubon-marketdata-mcp"
version = "1.0.0"
description = "富邦證券即時行情、五檔委託簿、技術指標與價格監測 MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fubon-common-contracts>=1.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
fubon-marketdata = "fubon_marketdata_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
