[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fubon-account-mcp"
version = "1.0.0"
description = "富邦證券唯讀帳務查詢與本機快照管理 MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fubon-common-contracts>=1.0.0",
    "mcp>=1.0.0",
]

[project.scripts]
fubon-account = "fubon_account_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
